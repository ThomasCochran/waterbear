# ~/.config/hypr/hyprlock.conf — themed screen, neon clock, neon password box
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(@@BG@@ff)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba(@@A@@ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %B %-d')"
    color = rgba(@@DIM@@ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# Prompt line
label {
    monitor =
    text = cmd[update:0] echo "[ $USER@$(cat /etc/hostname) ] access required"
    color = rgba(@@B@@ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 2
    inner_color = rgba(00000000)
    outer_color = rgba(@@A@@ff) rgba(@@B@@ff) 45deg
    check_color = rgba(@@C2@@ff) rgba(@@C6@@ff) 120deg
    fail_color = rgba(@@C1@@ff) rgba(@@C5@@ff) 40deg
    font_color = rgb(@@FG@@)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##@@DIM@@">enter password_</span>
    fail_text = <span foreground="##@@C1@@">ACCESS DENIED</span>
    fade_on_empty = false
    rounding = 4
    position = 0, -100
    halign = center
    valign = center
}
