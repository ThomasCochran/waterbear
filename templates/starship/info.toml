# ~/.config/starship.toml — Waterbear "info" prompt (generated)
add_newline = true
format = """
$directory$git_branch$git_status$python$nodejs$cmd_duration
$character"""

[directory]
style = "bold #@@A@@"
truncation_length = 4

[git_branch]
format = "on [$symbol$branch]($style) "
style = "#@@B@@"

[git_status]
style = "#@@C3@@"

[python]
format = "via [$symbol$version]($style) "
style = "#@@C3@@"

[nodejs]
format = "via [$symbol$version]($style) "
style = "#@@C2@@"

[cmd_duration]
format = "took [$duration]($style) "
style = "#@@DIM@@"
min_time = 2000

[character]
success_symbol = "[❯](bold #@@B@@)"
error_symbol = "[❯](bold #@@C1@@)"
