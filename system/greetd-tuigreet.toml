# /etc/greetd/config.toml — tuigreet is the login screen (Waterbear → Desktop → Login → greeter):
# a text greeter on tty1 where you type (or pick) a user and their password, then Hyprland starts.
# Unlike the hyprlock login screen, it works for any number of users.
[terminal]
vt = 1

[default_session]
command = "tuigreet --time --remember --remember-user-session --asterisks --greeting 'Waterbear' --cmd start-hyprland"
user = "greeter"
